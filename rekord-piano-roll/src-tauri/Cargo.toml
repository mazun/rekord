[package]
name = "rekord-piano-roll"
version = "0.1.1"
description = "Re:Kord - real-time chord and note recognition (piano-roll UI)"
license = "MIT"
authors = ["@y_mazun"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "rekord_piano_roll_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rekord_core = { path = "../../rust/core" }
anyhow = "1"
ureq = "3"
sha2 = "0.10"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# `npm run tauri dev` builds the debug profile, where the beat tracker's DBN (a float64
# Viterbi over ~5,800 states, twice a second) runs ~25x slower and can no longer keep up
# with real time. That decoder is its own crate so only it is optimized here.
[profile.dev.package.rekord_beat_dbn]
opt-level = 3

[target."cfg(windows)".dependencies]
# `#[implement]` expands to paths in `windows_core`, so it must be a direct dependency too.
windows-core = "0.61"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
