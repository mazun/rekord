<!doctype html>
<!-- Dev-only chord-lane replay; see dev/chords-mock.js and CLAUDE.md. Open
     http://localhost:1420/dev/chords.html?events=001.jsonl&until=60 under `npm run dev`. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Re:Kord (chord replay)</title>
    <script src="/dev/chords-mock.js"></script>
    <script type="module">
      // Debug handles for the browser console / an agent's JS tool:
      //   window.__roll     the PianoRoll instance (captured on its first lane update)
      //   window.__recording the Recording (its .lane is the composed chord lane)
      //   window.__settle(n) steps the ticker n x 100 ms frames (default 15) and renders, then
      //                     returns the chord sprites [label, from_s, to_s, alpha, dying]. A hidden
      //                     browser pane throttles requestAnimationFrame, so the ticker barely runs
      //                     there; call this right before each screenshot.
      import { PianoRoll } from "/src/pianoroll.ts";
      import { recording } from "/src/recording.ts";
      window.__recording = recording; // .lane.segments(): the composed chord lane
      const orig = PianoRoll.prototype.setChordSegments;
      PianoRoll.prototype.setChordSegments = function (u) {
        window.__roll = this;
        return orig.call(this, u);
      };
      window.__settle = (n = 15) => {
        const r = window.__roll;
        let t = performance.now();
        for (let i = 0; i < n; i++) r.app.ticker.update((t += 100));
        r.app.render();
        return r.chordSegments.map((c) => [c.label, +c.shownStartS.toFixed(2), c.shownEndS === null ? null : +c.shownEndS.toFixed(2), +c.alpha.toFixed(2), c.dying]);
      };
    </script>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body></body>
</html>
