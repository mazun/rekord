[package]
name = "rekord_core"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "rekord_core"
path = "src/lib.rs"

[dependencies]
ort = { version = "2.0.0-rc.13", features = ["directml", "ndarray"] }
ndarray = "0.17"
hound = "3.5"
rubato = "0.16"
anyhow = "1"
cpal = "0.18"
serde = { version = "1", features = ["derive"] }
rekord_beat_dbn = { path = "../beat_dbn" }

[build-dependencies]
ureq = "3"

[dev-dependencies]
ndarray-npy = { version = "0.10", default-features = false, features = ["npz"] }
